site_name: CatPlus
docs_dir: docs
site_dir: site

nav:
  - CHUC_NANG.md

theme:
  name: material
  language: vi

plugins:
  - search
  - redirects:
      redirect_maps:
        'index.md': 'CHUC_NANG.md'

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

exclude_docs: |
